[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yearning2-mcp"
version = "0.2.1"
description = "Yearning 2.x 的 MCP 服务端：只读查询 + 提工单/查数据，带多层安全闸门（零第三方依赖）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yearning2-mcp contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "yearning",
    "yearning2",
    "sql-audit",
    "sql",
    "mysql",
    "database",
    "dba",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]
# 刻意留空 —— 本包只用 Python 标准库，装它不会拖进任何依赖。
dependencies = []

[project.optional-dependencies]
release = ["build", "twine"]

[project.scripts]
yearning2-mcp = "yearning2_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/guanjwen/yearning2-mcp"
Repository = "https://github.com/guanjwen/yearning2-mcp"
Issues = "https://github.com/guanjwen/yearning2-mcp/issues"
Changelog = "https://github.com/guanjwen/yearning2-mcp/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
